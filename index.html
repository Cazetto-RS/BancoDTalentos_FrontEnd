<!doctype html>
<html lang="pt-BR">
  <head>
    <script>
      try {
        const saved = localStorage.getItem('talentos:theme') || localStorage.getItem('admin-theme');
        document.documentElement.dataset.theme = (saved === 'light' || saved === 'dark') ? saved : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      } catch (_) { document.documentElement.dataset.theme = 'light'; }
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Banco de Talentos da Point Media" />
    <title>Banco de Talentos</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
